; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:dfrobot_beetle_esp32c3]
platform = espressif32
board = dfrobot_beetle_esp32c3
framework = espidf

board_build.sdkconfig_defaults = sdkconfig.defaults

;bluetooth files
build_flags =
    -Icomponents/nimble/include
    -Icomponents/nimble/nimble
    -Icomponents/nimble/porting
    -Icomponents/nimble/host
    -Icomponents/nimble/services

    -DCONFIG_ADC_DISABLE_LEGACY_DRIVER=1
    -DCONFIG_I2C_ENABLE_OLD_DRIVER=0

    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BT_BLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_CONTROLLER_ENABLED=1
    -DCONFIG_BT_CONTROLLER_BLE_ONLY=1
    -DCONFIG_BTDM_CTRL_MODE_BLE_ONLY=1
